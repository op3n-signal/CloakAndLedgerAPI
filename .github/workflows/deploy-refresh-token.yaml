name: PROD Build and Push Encompass Middleware KeyGen Docker Image

on:
  push:
  #  branches:
  #    - main
  #    - master   
  workflow_dispatch:  # Enable manual triggering via GitHub UI

env:
  REGISTRY_IMAGE: ghcr.io/candid-middleware-organization/los-encompass-middleware-api/encompass.tokengenerator
  ROTATOR_IMAGE: ghcr.io/candid-middleware-organization/los-encompass-middleware-api/encompass.tokenrotator
  TAG_NAME: latest

permissions:
  packages: write
  contents: read

jobs:
  build-docker-image-keygen:
    name: Build & Push Docker image for Encompass Middleware KeyGen
    runs-on: middleware-candid-runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract and sanitize branch name
        id: vars
        run: |
          RAW_BRANCH="${GITHUB_REF#refs/heads/}"
          SAFE_BRANCH=$(echo "$RAW_BRANCH" | tr '[:upper:]' '[:lower:]' | tr '/' '-')
          echo "branch=$SAFE_BRANCH" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Get lowercase repo name
        id: repo
        run: |
          echo "REGISTRY_IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Use REGISTRY_IMAGE
        run: echo "Image name is $REGISTRY_IMAGE"

      - name: Build and push Docker image (latest tag)  # only tag latest on main branch
        #if: ${{ steps.vars.outputs.branch == 'master' }}
        uses: docker/build-push-action@v5
        with:
          context: .  # Change if your Dockerfile is in a subfolder
          file: TokenGenerator/Dockerfile
          push: true
          tags: ${{ env.REGISTRY_IMAGE }}:${{ env.TAG_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-docker-image-rotator:
    name: Build & Push Docker image for Encompass Middleware Key Rotation
    runs-on: middleware-candid-runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract and sanitize branch name
        id: vars
        run: |
          RAW_BRANCH="${GITHUB_REF#refs/heads/}"
          SAFE_BRANCH=$(echo "$RAW_BRANCH" | tr '[:upper:]' '[:lower:]' | tr '/' '-')
          echo "branch=$SAFE_BRANCH" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Get lowercase repo name
        id: repo
        run: |
          echo "REGISTRY_IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Use REGISTRY_IMAGE
        run: echo "Image name is $REGISTRY_IMAGE"

      - name: Build and push Docker image (latest tag)  # only tag latest on main branch
        #if: ${{ steps.vars.outputs.branch == 'master' }}
        uses: docker/build-push-action@v5
        with:
          context: .  # Change if your Dockerfile is in a subfolder
          file: TokenRotator/Dockerfile
          push: true
          tags: ${{ env.ROTATOR_IMAGE }}:${{ env.TAG_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pull-prod-docker-images:
    name: Deploy to Production Docker Images
    needs: 
      - build-docker-image-keygen
      - build-docker-image-rotator
    runs-on: [self-hosted, middleware-candid-runner]
    timeout-minutes: 15
    #if: github.ref == 'refs/heads/master'   # 👈 Only run on main branch
    env:
      REGISTRY_IMAGE: ghcr.io/${{ github.repository }}   #Gets loaded with the lowercase repo name later in the steps
      SERVER: 172.31.47.203
      SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      CONTAINER_NAME: encompass-middleware-token-generator
      CONTAINER_NAME_ROTATOR: encompass-middleware-token-rotator
      
    steps:
      # SSH into your private server & restart the container
      - name: Get lowercase repo name
        id: repo
        run: |
          echo "REGISTRY_IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Pull Image on server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host:     ${{ env.SERVER }}
          username: ubuntu
          key:      ${{ env.SSH_KEY }}
          script: |
            set -e

            echo "👉 Logging in to GHCR"
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u candid-front-end-organization --password-stdin

            echo "👉 Pulling image - Generator"
            docker pull ${{ env.REGISTRY_IMAGE }}:${{env.TAG_NAME}}

            echo "👉 Pulling image - Rotator"
            docker pull ${{ env.ROTATOR_IMAGE }}:${{ env.TAG_NAME }}

            # Remove any existing container with the same name
            docker rm -f ${{ env.CONTAINER_NAME_ROTATOR }} || true

            echo "👉 Running Image - Token Rotator"
            docker run -d --rm \
              --name ${{ env.CONTAINER_NAME_ROTATOR }} \
              -v /var/run/docker.sock:/var/run/docker.sock \
              --memory="256m" \
              --cpus="0.25" \
              ${{ env.ROTATOR_IMAGE }}:${{ env.TAG_NAME }}

            echo "✔ Deployment complete"         